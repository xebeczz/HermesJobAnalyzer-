# Analyzer configuration.
# Changing DAILY_REPORT_TIME requires updating the Hermes cron schedule to match:
#   hermes cron edit <job> 'M H * * *'   (times interpreted in TIMEZONE below)

# Daily digest delivery time (24h clock) in the user's timezone.
DAILY_REPORT_TIME: "06:00"

# User timezone — Hermes cron evaluates schedules in this zone.
TIMEZONE: "Asia/Kolkata"

# Morning deadline-watch: silent unless a deadline is within this many days.
DEADLINE_WATCH_DAYS: 2
DEADLINE_WATCH_TIME: "09:00"

# Days remaining at/below which an opportunity is flagged "deadline approaching".
DEADLINE_APPROACHING_DAYS: 7

# Detection keywords (context still required — a keyword hit alone is not an opportunity).
detection_keywords:
  - internship
  - intern
  - hiring
  - job
  - job opening
  - recruitment
  - campus hiring
  - off-campus
  - software engineer
  - software developer
  - AI
  - artificial intelligence
  - machine learning
  - ML
  - data science
  - data analyst
  - Python developer
  - full stack
  - frontend
  - backend
  - React
  - FastAPI
  - developer
  - trainee
  - graduate
  - fresher
  - entry level
  - walk-in
  - apply now
  - career opportunity
  - placement

# Match classifications (no numeric scores).
match_classifications:
  - Strong match
  - Moderate match
  - Partial match
  - Low match

# Lifecycle statuses.
statuses:
  - new
  - saved
  - deadline-approaching
  - needs-verification
  - ready-to-apply
  - rejected
