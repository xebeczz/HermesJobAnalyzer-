# Product-based company watchlist for the Internship & Job Opportunity Analyzer.
#
# These are the official careers/internship pages the scout checks for new
# openings relevant to the profile in config/profile.yaml. Only official
# company domains are listed here — never third-party job boards.
#
# The daily digest automatically includes any watchlist opportunity that gets
# ingested into data/opportunities.json. Ongoing automated scouting runs via
# the (currently paused) "Company Scout" cron job; it needs a working
# inference provider on the gateway before it can run.

companies:
  - name: Google
    careers_url: https://careers.google.com/jobs/results/
    internship_url: https://buildyourfuture.withgoogle.com/programs/step/
    focus: [SWE Intern, STEP Intern, AI/ML roles]

  - name: Microsoft
    careers_url: https://jobs.careers.microsoft.com/global/en/search
    internship_url: https://jobs.careers.microsoft.com/global/en/search?q=intern
    focus: [SWE Intern, Explore Intern, Data Science]

  - name: Amazon
    careers_url: https://www.amazon.jobs/en/search
    internship_url: https://www.amazon.jobs/en/search?base_query=intern
    focus: [SDE Intern, Data Science Intern, ML roles]

